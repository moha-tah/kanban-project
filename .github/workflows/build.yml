name: Build Multi-OS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  package-matrix:
    name: Package ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            extra-args: "--win-console"
          - os: ubuntu-latest
            os-name: Linux
            extra-args: ""
          - os: macos-latest
            os-name: MacOS
            extra-args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Prepare
        shell: bash
        run: |
          mvn clean package dependency:copy-dependencies -DoutputDirectory=target/dist -DskipTests
          cp target/kanban-project-1.0-SNAPSHOT.jar target/dist/

      # Création du Client
      - name: Package Client
        shell: bash
        run: |
          jpackage --name KanbanClient \
            --input target/dist \
            --main-jar kanban-project-1.0-SNAPSHOT.jar \
            --main-class client.MainApp \
            --type app-image \
            --dest dist-pkg \
            ${{ matrix.extra-args }}

      # Création du Serveur
      - name: Package Server
        shell: bash
        run: |
          jpackage --name KanbanServer \
            --input target/dist \
            --main-jar kanban-project-1.0-SNAPSHOT.jar \
            --main-class server.ServerApp \
            --type app-image \
            --dest dist-pkg \
            ${{ matrix.extra-args }}

      # --- MODIFICATION ICI : DEUX UPLOADS SÉPARÉS ---

      # 1. Upload uniquement le Client
      - name: Upload Client (${{ matrix.os-name }})
        uses: actions/upload-artifact@v4
        with:
          name: KanbanClient-${{ matrix.os-name }}
          path: dist-pkg/KanbanClient* # Le '*' permet de prendre le dossier (Win/Linux) ou le .app (Mac)

      # 2. Upload uniquement le Serveur
      - name: Upload Server (${{ matrix.os-name }})
        uses: actions/upload-artifact@v4
        with:
          name: KanbanServer-${{ matrix.os-name }}
          path: dist-pkg/KanbanServer*