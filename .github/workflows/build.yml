name: SonarQube
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=moha-tah_kanban-project

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Copy Dependencies
        run: |
          mvn clean package dependency:copy-dependencies -DoutputDirectory=target/dist
          copy target/kanban-project-1.0-SNAPSHOT.jar target/dist/

      # Crée l'exe pour le client
      - name: Create Client Executable
        run: |
          jpackage --name KanbanClient --input target/dist --main-jar kanban-project-1.0-SNAPSHOT.jar --main-class client.MainApp --type app-image --win-console

      # Crée l'exe pour le serveur
      - name: Create Server Executable
        run: |
          jpackage --name KanbanServer --input target/dist --main-jar kanban-project-1.0-SNAPSHOT.jar --main-class server.ServerApp --type app-image --win-console

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanbanClient-Windows
          path: KanbanClient

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanbanServer-Windows
          path: KanbanServer