name: Build Linux Executables

on:
  push:
    branches: ["package_export", "main", "[vV][0-9]+"]

permissions:
  contents: read
  actions: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          architecture: x64
          cache: "maven"

      - name: Build with Maven (Create Fat JAR)
        run: mvn -B package -DskipTests

      # --- 1. Création de l'APP CLIENT ---
      - name: Create Client App
        run: |
          jpackage --input target \
            --name KanbanClient \
            --main-jar kanban-project-1.0-SNAPSHOT.jar \
            --main-class client.Launcher \
            --type app-image \
            --dest dist_client

      # --- 2. Création de l'APP SERVEUR ---
      - name: Create Server App
        run: |
          jpackage --input target \
            --name KanbanServer \
            --main-jar kanban-project-1.0-SNAPSHOT.jar \
            --main-class server.ServerLauncher \
            --type app-image \
            --dest dist_server

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanbanClient-Linux
          path: dist_client/KanbanClient

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanbanServer-Linux
          path: dist_server/KanbanServer

      - name: Cleanup Old Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            
            console.log(`Cleaning up old artifacts for branch: ${branch}`);
            
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo }
            );
            
            for (const artifact of artifacts) {
              if (artifact.workflow_run && artifact.workflow_run.head_branch === branch && artifact.workflow_run.id !== context.runId) {
                console.log(`Deleting artifact ${artifact.name} (id: ${artifact.id}) from run ${artifact.workflow_run.id}`);
                try {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id,
                  });
                } catch (error) {
                  console.error(`Failed to delete artifact ${artifact.id}: ${error.message}`);
                }
              }
            }
