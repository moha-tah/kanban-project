name: Build Windows Executables

on:
  push:
    branches: ["package_export", "main", "[vV][0-9]+"]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          architecture: x64
          cache: "maven"

      - name: Build with Maven (Create Fat JAR)
        run: mvn -B package -DskipTests

      # --- 1. Création de l'EXE CLIENT ---
      - name: Create Client Executable
        shell: cmd
        run: |
          jpackage --input target ^
            --name KanbanClient ^
            --main-jar kanban-project-1.0-SNAPSHOT.jar ^
            --main-class client.Launcher ^
            --type app-image ^
            --dest dist_client ^
            --win-console

      # --- 2. Création de l'EXE SERVEUR ---
      - name: Create Server Executable
        shell: cmd
        run: |
          jpackage --input target ^
            --name KanbanServer ^
            --main-jar kanban-project-1.0-SNAPSHOT.jar ^
            --main-class server.ServerLauncher ^
            --type app-image ^
            --dest dist_server ^
            --win-console

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanbanClient-Windows
          path: dist_client/KanbanClient
          retention-days: 5

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanbanServer-Windows
          path: dist_server/KanbanServer
          retention-days: 5
