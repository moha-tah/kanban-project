name: Build Windows Executables

on:
  push:
    branches: ["package_export", "main", "[vV][0-9]+"]

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Setup and Build
        uses: ./.github/actions/setup-build

      - name: Package Client
        uses: ./.github/actions/package-artifact
        with:
          app-name: KanbanClient
          main-class: client.Launcher
          destination: dist_client
          artifact-name: KanbanClient-Windows
          artifact-path: dist_client/KanbanClient
          extra-jpackage-args: '--win-console'

      - name: Package Server
        uses: ./.github/actions/package-artifact
        with:
          app-name: KanbanServer
          main-class: server.ServerLauncher
          destination: dist_server
          artifact-name: KanbanServer-Windows
          artifact-path: dist_server/KanbanServer
          extra-jpackage-args: '--win-console'

      - name: Cleanup Old Artifacts
        uses: ./.github/actions/cleanup-artifacts
