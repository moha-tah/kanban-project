name: Build MacOS ARM Executables

on:
  push:
    branches: ["package_export", "main", "[vV][0-9]+"]

permissions:
  contents: read
  actions: write

jobs:
  build-macos-arm:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Setup and Build
        uses: ./.github/actions/setup-build
        with:
          java-architecture: aarch64

      - name: Package Client
        uses: ./.github/actions/package-artifact
        with:
          app-name: KanbanClient
          main-class: client.Launcher
          destination: dist_client
          artifact-name: KanbanClient-MacOS-ARM
          artifact-path: dist_client/KanbanClient.app

      - name: Package Server
        uses: ./.github/actions/package-artifact
        with:
          app-name: KanbanServer
          main-class: server.ServerLauncher
          destination: dist_server
          artifact-name: KanbanServer-MacOS-ARM
          artifact-path: dist_server/KanbanServer.app

      - name: Cleanup Old Artifacts
        uses: ./.github/actions/cleanup-artifacts
